name: Build K90Max kernelsu.ko

on:
  workflow_dispatch:
    inputs:
      source:
        description: '内核源码来源: xiaomi (bsp-prague-w-oss 专用 KMI) / gki (DDK 标准)'
        type: choice
        default: xiaomi
        options: [xiaomi, gki]
  push:
    branches: [main]

env:
  DDK_IMAGE: ghcr.io/ylarod/ddk-min:android16-6.12-20260313
  KSU_REF: v3.2.5
  # 设备实际内核 vermagic 目标 (红米K90Max 6.12.58 HyperOS 定制)
  TARGET_VERMAGIC: 6.12.58-android16-6-g3690567af937-abogki504922916-4k SMP preempt mod_unload modversions aarch64

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko (${{ inputs.source || 'xiaomi' }} KMI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: ${{ env.KSU_REF }}
          path: KernelSU

      - name: Checkout Xiaomi kernel source (bsp-prague-w-oss)
        if: ${{ inputs.source == 'xiaomi' }}
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: bsp-prague-w-oss
          path: xiaomi-kernel

      # 缓存 DDK 镜像: 命中后 docker load 秒级恢复
      - name: Cache DDK image
        id: ddk-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ddk-image.tar
          key: ddk-image-${{ env.DDK_IMAGE }}

      - name: Load or pull DDK image
        run: |
          if [ -f /tmp/ddk-image.tar ]; then
            echo "==> DDK 镜像命中缓存, docker load 秒级恢复"
            docker load -i /tmp/ddk-image.tar
          else
            echo "==> 首次运行, 拉取 DDK 镜像 $DDK_IMAGE"
            docker pull "$DDK_IMAGE"
            docker save -o /tmp/ddk-image.tar "$DDK_IMAGE"
            ls -lh /tmp/ddk-image.tar
          fi

      - name: Build kernelsu.ko in DDK container
        run: |
          set -e
          git config --global --add safe.directory '*'
          mkdir -p out
          SOURCE_MODE="${{ inputs.source || 'xiaomi' }}"
          echo "==> 内核源码来源: $SOURCE_MODE"
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            "$DDK_IMAGE" /bin/bash -c '
            set -e
            cd /workspace/KernelSU/kernel
            if [ "$1" = "xiaomi" ]; then
              echo "=== [xiaomi] 准备小米内核源码 (bsp-prague-w-oss) ==="
              cd /workspace/xiaomi-kernel
              # gki_defconfig 含 SECURITY_SELINUX; 6.12 GKI 的 prepare 不再默认生成 SELinux 头, 显式触发
              make ARCH=arm64 CC=clang LLVM=1 gki_defconfig
              make ARCH=arm64 CC=clang LLVM=1 prepare
              echo "=== 手动生成 SELinux flask.h / av_permissions.h ==="
              ./scripts/selinux/genheaders/genheaders security/selinux/include/flask.h security/selinux/include/av_permissions.h
              ls -la security/selinux/include/flask.h security/selinux/include/av_permissions.h 2>&1 || true
              # 借用 DDK 标准 GKI 的 Module.symvers 供 modpost 解析符号
              # (KMI 冻结下 CRC 一致; 若不一致则上机报 CRC mismatch, 即 KMI 不兼容的直接证据)
              if [ -f "$KERNEL_SRC/Module.symvers" ]; then
                echo "=== 借用标准 GKI Module.symvers: $KERNEL_SRC/Module.symvers ==="
                cp "$KERNEL_SRC/Module.symvers" /workspace/xiaomi-kernel/Module.symvers
              else
                echo "WARNING: \$KERNEL_SRC/Module.symvers 不存在"
              fi
              echo "=== [xiaomi] 编译 kernelsu.ko (KDIR=小米源码, KBUILD_MODPOST_WARN=1) ==="
              cd /workspace/KernelSU/kernel
              # KernelSU Makefile 用 KDIR 变量(非 KERNEL_SRC); 手动 modfinal 兜底
              CONFIG_KSU=m CC=clang KBUILD_MODPOST_WARN=1 make KDIR="/workspace/xiaomi-kernel" || echo "=== make modules 部分失败, 尝试手动 modfinal ==="
              ls -la kernelsu.mod.c kernelsu.mod.o kernelsu.ko 2>/dev/null || true
              if [ ! -f kernelsu.ko ]; then
                echo "=== 手动 modfinal: mod.o + 链接 .ko ==="
                make -C /workspace/xiaomi-kernel M=/workspace/KernelSU/kernel src=/workspace/KernelSU/kernel kernelsu.mod.o 2>&1 | tail -3 || true
                make -C /workspace/xiaomi-kernel M=/workspace/KernelSU/kernel src=/workspace/KernelSU/kernel kernelsu.ko 2>&1 | tail -3 || true
                ls -la kernelsu.ko 2>/dev/null || echo "手动 modfinal 仍失败"
              fi
              cp -f kernelsu.ko /workspace/out/kernelsu.ko 2>/dev/null || echo "无 kernelsu.ko 产物"
              echo "=== [xiaomi] KDIR 校验 ==="
              grep -m1 "KernelRelease\|CONFIG_LOCALVERSION" /workspace/xiaomi-kernel/include/config/kernel.release 2>/dev/null || cat /workspace/xiaomi-kernel/include/config/kernel.release 2>/dev/null || echo "(无 kernel.release)"
            else
              echo "=== [gki] DDK 标准 KDIR, 编译 kernelsu.ko ==="
              CONFIG_KSU=m CC=clang make
            fi
            echo "=== Build completed ==="
            cp kernelsu.ko /workspace/out/kernelsu.ko
          ' -- "$SOURCE_MODE"
          ls -la out/
          echo "Size: $(du -h out/kernelsu.ko | cut -f1)"
          (llvm-strip -d out/kernelsu.ko || strip -d out/kernelsu.ko || true)
          echo "=== modinfo (编译后) ==="
          (modinfo out/kernelsu.ko 2>/dev/null || true)

      - name: Fix vermagic for device kernel (6.12.58-abogki)
        run: |
          set -e
          python3 fix_vermagic.py out/kernelsu.ko "$TARGET_VERMAGIC" out/kernelsu-6.12.58-fixed.ko
          cp out/kernelsu-6.12.58-fixed.ko out/kernelsu.ko
          echo "=== modinfo (vermagic 适配后) ==="
          (modinfo out/kernelsu-6.12.58-fixed.ko 2>/dev/null | grep -E "vermagic|name" || true)
          ls -la out/

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko-${{ inputs.source || 'xiaomi' }}-6.12.58-fixed
          path: out/
