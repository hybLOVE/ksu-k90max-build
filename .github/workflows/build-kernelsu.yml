name: Build K90Max kernelsu.ko

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  DDK_IMAGE: ghcr.io/ylarod/ddk-min:android16-6.12-20260313
  KSU_REF: v3.2.5

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko (android16-6.12 / DDK cached)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          ref: ${{ env.KSU_REF }}
          path: KernelSU

      # 缓存 DDK 镜像: 命中后 docker load 秒级恢复, 免去每次重新 pull 数 GB
      - name: Cache DDK image
        id: ddk-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ddk-image.tar
          key: ddk-image-${{ env.DDK_IMAGE }}

      - name: Load or pull DDK image
        run: |
          if [ -f /tmp/ddk-image.tar ]; then
            echo "==> DDK 镜像命中缓存, docker load 秒级恢复"
            docker load -i /tmp/ddk-image.tar
          else
            echo "==> 首次运行, 拉取 DDK 镜像 $DDK_IMAGE"
            docker pull "$DDK_IMAGE"
            echo "==> 保存镜像到缓存"
            docker save -o /tmp/ddk-image.tar "$DDK_IMAGE"
            ls -lh /tmp/ddk-image.tar
          fi

      - name: Build kernelsu.ko in DDK container
        run: |
          set -e
          git config --global --add safe.directory '*'
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            "$DDK_IMAGE" /bin/bash -c "
              set -e
              cd /workspace/KernelSU/kernel
              echo '=== Building kernelsu.ko for KMI android16-6.12 (DDK) ==='
              CONFIG_KSU=m CC=clang make
              echo '=== Build completed ==='
              cp kernelsu.ko /workspace/out/android16-6.12_kernelsu.ko
            "
          ls -la out/
          echo "Size: $(du -h out/android16-6.12_kernelsu.ko | cut -f1)"
          (llvm-strip -d out/android16-6.12_kernelsu.ko || strip -d out/android16-6.12_kernelsu.ko || true)
          echo "Size after strip: $(du -h out/android16-6.12_kernelsu.ko | cut -f1)"
          echo "=== modinfo ==="
          (modinfo out/android16-6.12_kernelsu.ko 2>/dev/null || true)

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko-android16-6.12
          path: out/
